# 上线配置：所有敏感信息都从环境变量读，不写进仓库
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hiyori}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Europe/Helsinki
    username: ${DB_USER:hiyori}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  wx:
    mock-login: false
