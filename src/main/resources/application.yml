# ============================================================
# Hiyori 亚超后端配置
#   默认（dev）：H2 内存库 + 模拟微信登录，clone 下来直接 mvn spring-boot:run
#   上线（prod）：MySQL + 真实微信登录，见 application-prod.yml
# ============================================================
server:
  port: 8080

spring:
  application:
    name: hiyori-mall-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:hiyori;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Europe/Helsinki
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 上线必须用环境变量覆盖，至少 32 个字符
    secret: ${APP_JWT_SECRET:dev-only-secret-please-change-me-0123456789}
    ttl-hours: 168
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # 模拟登录：code 直接当 openid 用，只在本地开发打开
    mock-login: true
  # 这些 openid 登录后自动成为管理员（老板 / 你自己），逗号分隔
  admin-openids: ${APP_ADMIN_OPENIDS:dev-admin}
  upload:
    # 图片不进入代码仓库；本地运行时通过 APP_UPLOAD_DIR 指向外部素材目录
    dir: ${APP_UPLOAD_DIR:./uploads}
    # 返回给前端的图片地址前缀；上线后改成 https://你的域名/files
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/files}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
